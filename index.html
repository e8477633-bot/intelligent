<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christa AI</title>
<style>
  :root { 
    --bg: #0a0c10; 
    --panel: #151a22; 
    --accent: #00e676; 
    --text: #e6e8ee; 
    --user-msg: #007aff;
  }
  * { box-sizing: border-box; }
  body { 
    font-family: system-ui, -apple-system, sans-serif; 
    background: var(--bg); 
    color: var(--text); 
    margin: 0; 
    padding: 10px; 
    display: flex; 
    justify-content: center; 
    height: 100dvh;
  }
  .app-container { 
    width: 100%; 
    max-width: 600px; 
    background: var(--panel); 
    border-radius: 16px; 
    border: 1px solid #2a2f3d; 
    display: flex; 
    flex-direction: column; 
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .header { 
    background: #1a1f2b; 
    padding: 16px; 
    text-align: center;
    border-bottom: 1px solid #2a2f3d;
    position: relative;
  }
  .header h1 { margin: 0; font-size: 1.2rem; color: var(--accent); }
  .header p { margin: 4px 0 0; font-size: 0.75rem; color: #8890a4; }
  
  .settings-btn {
    position: absolute;
    right: 16px;
    top: 16px;
    background: none;
    border: none;
    color: #8890a4;
    font-size: 1.2rem;
    cursor: pointer;
  }
  .settings-btn:hover { color: var(--text); }

  .settings-panel {
    display: none;
    background: #1a1f2b;
    padding: 16px;
    border-bottom: 1px solid #2a2f3d;
  }
  .settings-panel.active { display: block; }
  .settings-panel input {
    width: 100%;
    padding: 10px;
    background: var(--bg);
    border: 1px solid #2a2f3d;
    color: var(--text);
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 0.9rem;
  }
  .settings-panel button {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  .settings-note { font-size: 0.7rem; color: #8890a4; margin-top: 8px; text-align: center; }
  
  .chat-log { 
    flex: 1; 
    overflow-y: auto; 
    padding: 16px; 
    display: flex; 
    flex-direction: column; 
    gap: 12px; 
  }
  
  .msg { 
    max-width: 85%; 
    padding: 10px 14px; 
    border-radius: 12px; 
    font-size: 0.95rem; 
    line-height: 1.5; 
    white-space: pre-wrap; 
    word-wrap: break-word;
  }
  .msg.user { 
    align-self: flex-end; 
    background: var(--user-msg); 
    color: #fff; 
    border-bottom-right-radius: 2px;
  }
  .msg.ai { 
    align-self: flex-start; 
    background: #232936; 
    color: var(--text); 
    border-bottom-left-radius: 2px;
  }
  .msg.error { 
    align-self: center; 
    background: #ff3b30; 
    color: #fff; 
    font-size: 0.8rem; 
    text-align: center;
  }
  
  .input-area { 
    padding: 12px; 
    background: #1a1f2b; 
    border-top: 1px solid #2a2f3d; 
    display: flex; 
    gap: 8px; 
  }
  .input-area input { 
    flex: 1; 
    padding: 12px; 
    background: var(--bg); 
    border: 1px solid #2a2f3d; 
    color: var(--text); 
    border-radius: 8px; 
    font-size: 1rem;
    outline: none;
  }
  .input-area input:focus { border-color: var(--accent); }
  .input-area button { 
    padding: 12px 20px; 
    background: var(--accent); 
    color: #000; 
    border: none; 
    border-radius: 8px; 
    font-weight: bold; 
    cursor: pointer; 
    transition: 0.2s;
  }
  .input-area button:disabled { background: #3a4256; cursor: not-allowed; }
  
  .typing { font-style: italic; color: #8890a4; font-size: 0.8rem; }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>✨ Christa AI</h1>
    <p>Developed by Lumbani Nyirenda<br>in coherence with Malawian programmer, Emmanuel</p>
    <button class="settings-btn" id="settingsBtn" title="API Settings">⚙️</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <input type="password" id="apiKeyInput" placeholder="Paste API Key here (starts with AQ. or AIza...)">
    <button id="saveKeyBtn">Save Key</button>
    <div class="settings-note">
      Get a free key at <b>aistudio.google.com/app/apikey</b><br>
      Your key is saved locally on your device only.
    </div>
  </div>

  <div class="chat-log" id="chatLog">
    <div class="msg ai">Hello! I am Christa. Ask me anything about life, advice, or real-world questions.</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask Christa anything..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const chatLog = document.getElementById('chatLog');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const apiKeyInput = document.getElementById('apiKeyInput');
const saveKeyBtn = document.getElementById('saveKeyBtn');

let conversationHistory = [];
let apiKey = localStorage.getItem('christa_api_key') || '';

if (apiKey) {
  apiKeyInput.value = apiKey;
} else {
  settingsPanel.classList.add('active');
}

settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('active');
});

saveKeyBtn.addEventListener('click', () => {
  const key = apiKeyInput.value.trim();
  if (key.startsWith('AIza') || key.startsWith('AQ.')) {
    apiKey = key;
    localStorage.setItem('christa_api_key', key);
    settingsPanel.classList.remove('active');
    
    const sysMsg = document.createElement('div');
    sysMsg.className = 'msg ai';
    sysMsg.textContent = 'API Key saved successfully! You can now chat.';
    chatLog.appendChild(sysMsg);
    chatLog.scrollTop = chatLog.scrollHeight;
    setTimeout(() => sysMsg.remove(), 3000);
    
  } else {
    alert('Invalid API Key format. It should start with "AIza" or "AQ.".');
  }
});

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}

async function sendMessage() {
  const prompt = userInput.value.trim();
  if (!prompt) return;

  if (!apiKey) {
    settingsPanel.classList.add('active');
    apiKeyInput.focus();
    return;
  }

  addMessage(prompt, 'user');
  userInput.value = '';
  sendBtn.disabled = true;
  
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg ai typing';
  typingDiv.textContent = 'Christa is thinking...';
  chatLog.appendChild(typingDiv);
  chatLog.scrollTop = chatLog.scrollHeight;

  conversationHistory.push({ role: 'user', parts: [{ text: prompt }] });

  const systemInstruction = {
    parts: [{ 
      text: `You are Christa, an advanced AI assistant created and developed by Lumbani Nyirenda, in coherence with Malawian programmer, Emmanuel. 
      When asked about your name, you must say your name is Christa. 
      When asked who made you, who developed you, or who created you, you must proudly state that you were developed by Lumbani Nyirenda in coherence with Malawian programmer, Emmanuel. 
      Never mention Google, Gemini, or OpenAI. You are Christa. 
      You are helpful, intelligent, and friendly. Answer real-world questions accurately and provide helpful life advice.` 
    }]
  };

  try {
    // 1. Added AbortController for a 15-second timeout
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);

    // 2. Set up headers dynamically based on the key type
    let headers = { 'Content-Type': 'application/json' };
    
    if (apiKey.startsWith('AQ.')) {
      // New AQ. keys require Bearer token authorization
      headers['Authorization'] = `Bearer ${apiKey}`;
    } else {
      // Old AIza keys use the x-goog-api-key header
      headers['x-goog-api-key'] = apiKey;
    }

    // 3. Use gemini-1.5-flash (The most stable, free-tier model currently available)
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`,
      {
        method: 'POST',
        headers: headers,
        signal: controller.signal, // Hooks up the timeout
        body: JSON.stringify({ 
          contents: conversationHistory,
          systemInstruction: systemInstruction
        })
      }
    );

    clearTimeout(timeoutId); // Clear timeout if fetch succeeds

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || `HTTP Error ${response.status}`);
    }

    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
    
    if (!aiText) {
      throw new Error('No response generated.');
    }

    typingDiv.remove();
    addMessage(aiText, 'ai');
    conversationHistory.push({ role: 'model', parts: [{ text: aiText }] });

  } catch (err) {
    typingDiv.remove();
    
    // Check if it was a timeout
    if (err.name === 'AbortError') {
      addMessage(`Error: Christa took too long to reply. Check your internet connection or try again.`, 'error');
    } else {
      addMessage(`Error: ${err.message}`, 'error');
    }
    
    conversationHistory.pop(); 
  } finally {
    sendBtn.disabled = false;
    userInput.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
