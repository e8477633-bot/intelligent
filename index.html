<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christa AI</title>
<style>
  :root { --bg: #0a0c10; --panel: #151a22; --accent: #00e676; --text: #e6e8ee; --user-msg: #007aff; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; height: 100dvh; }
  .app-container { width: 100%; max-width: 600px; background: var(--panel); border-radius: 16px; border: 1px solid #2a2f3d; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .header { background: #1a1f2b; padding: 16px; text-align: center; border-bottom: 1px solid #2a2f3d; }
  .header h1 { margin: 0; font-size: 1.2rem; color: var(--accent); }
  .header p { margin: 4px 0 0; font-size: 0.75rem; color: #8890a4; }
  .chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 2px; }
  .msg.ai { align-self: flex-start; background: #232936; color: var(--text); border-bottom-left-radius: 2px; }
  .msg.error { align-self: center; background: #ff3b30; color: #fff; font-size: 0.8rem; text-align: center; }
  .input-area { padding: 12px; background: #1a1f2b; border-top: 1px solid #2a2f3d; display: flex; gap: 8px; }
  .input-area input { flex: 1; padding: 12px; background: var(--bg); border: 1px solid #2a2f3d; color: var(--text); border-radius: 8px; font-size: 1rem; outline: none; }
  .input-area input:focus { border-color: var(--accent); }
  .input-area button { padding: 12px 20px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .input-area button:disabled { background: #3a4256; cursor: not-allowed; }
  .typing { font-style: italic; color: #8890a4; font-size: 0.8rem; }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>✨ Christa AI</h1>
    <p>Developed by Lumbani Nyirenda<br>in coherence with Malawian programmer, Emmanuel</p>
  </div>

  <div class="chat-log" id="chatLog">
    <div class="msg ai">Hello! I am Christa. Ask me anything about life, advice, or real-world questions.
    <!-- QR Code Generation -->
<qr-code value="https://example.com" size="200" error-correction="H"></qr-code>
<qr-generator data="{{ url }}" format="svg"></qr-generator>

<!-- Barcode -->
<barcode type="code128" value="123456789"></barcode>

<!-- Generic Generator -->
<generator type="qr" payload="..." options='{"size":300,"color":"#000"}'></generator></div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask Christa anything..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const chatLog = document.getElementById('chatLog');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

let conversationHistory = [];

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}

async function sendMessage() {
  const prompt = userInput.value.trim();
  if (!prompt) return;

  addMessage(prompt, 'user');
  userInput.value = '';
  sendBtn.disabled = true;
  
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg ai typing';
  typingDiv.textContent = 'Christa is thinking...';
  chatLog.appendChild(typingDiv);
  chatLog.scrollTop = chatLog.scrollHeight;

  conversationHistory.push({ role: 'user', parts: [{ text: prompt }] });

  try {
    // CALLING YOUR OWN SECURE VERCEL API ROUTE
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history: conversationHistory })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Server error');
    }

    typingDiv.remove();
    addMessage(data.reply, 'ai');
    conversationHistory.push({ role: 'model', parts: [{ text: data.reply }] });

  } catch (err) {
    typingDiv.remove();
    addMessage(`Error: ${err.message}`, 'error');
    conversationHistory.pop(); 
  } finally {
    sendBtn.disabled = false;
    userInput.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
